services:
  mongodb:
    image: mongo:7
    container_name: watchtogether-mongo
    restart: unless-stopped
    # Don't expose MongoDB port externally in production
    # Uncomment for local development only:
    # ports:
    #   - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=watchtogether
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchtogether-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # MongoDB connection with authentication
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING:-mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017}
      - MongoDB__DatabaseName=watchtogether
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET is required}
      - Jwt__Issuer=WatchTogether
      - Jwt__Audience=WatchTogether
      - Jwt__ExpirationHours=24
      - Cors__AllowedOrigins__0=${FRONTEND_URL:-http://localhost:3000}
      - Cors__AllowedOrigins__1=http://localhost
      - Cors__AllowedOrigins__2=http://127.0.0.1:3000
      - WebRTC__CloudflareTurnKeyId=${CLOUDFLARE_TURN_KEY_ID:-}
      - WebRTC__CloudflareTurnApiToken=${CLOUDFLARE_TURN_API_TOKEN:-}
      - WebRTC__CloudflareTurnTtlSeconds=${CLOUDFLARE_TURN_TTL_SECONDS:-}
      - WebRTC__TurnUrl=${TURN_URL:-}
      - WebRTC__TurnUsername=${TURN_USERNAME:-}
      - WebRTC__TurnCredential=${TURN_CREDENTIAL:-}
      - WebRTC__TurnTlsPort=${TURN_TLS_PORT:-}
      - App__FrontendUrl=${FRONTEND_URL:-http://localhost:3000}
      - Email__ResendApiKey=${RESEND_API_KEY:-}
      - Email__FromEmail=${EMAIL_FROM:-noreply@watchtogether.lol}
      - Email__FromName=WatchTogether
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${API_URL:-http://localhost:5001}
        - VITE_SIGNALR_URL=${SIGNALR_URL:-http://localhost:5001/hubs/watchtogether}
    container_name: watchtogether-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  mongodb_data:
