# Railway service definition for WatchTogether frontend (Vite build + nginx static)
#
# VITE_API_URL and VITE_SIGNALR_URL are BUILD-TIME variables — Vite bakes them
# into the JS bundle during `npm run build`. Railway passes service variables as
# both runtime env vars and Docker build args by default, so the Dockerfile's
# `ARG VITE_API_URL` picks them up automatically. Changing those values in the
# dashboard requires a new build to take effect.
#
# BACKEND_HOST is RUNTIME-only — it's substituted into nginx.conf.template at
# container start via envsubst, used to build the CSP `connect-src` header.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Static nginx is stateless — could scale freely, but 1 replica is plenty for
# this app's traffic and matches the backend (single-region, EU West).
numReplicas = 1

# nginx serves index.html on /. Returns 200 immediately when ready; no need
# for a longer timeout like the backend's .NET cold start.
healthcheckPath = "/"
healthcheckTimeout = 15

# Same rationale as backend — surface real crashes instead of restart-looping
# forever. nginx itself almost never crashes; this mostly catches misconfig.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
