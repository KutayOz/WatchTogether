<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.08" stroke="#f59e0b" stroke-width="1.5" fill="none">
    <circle cx="1050" cy="120" r="80"/>
    <circle cx="1050" cy="120" r="140"/>
    <circle cx="150" cy="510" r="100"/>
    <circle cx="150" cy="510" r="170"/>
  </g>

  <g transform="translate(140 220)" filter="url(#glow)">
    <rect width="160" height="160" rx="36" fill="url(#amber)"/>
    <rect x="22" y="38" width="116" height="78" rx="10" fill="#0f172a"/>
    <path d="M68 60 L106 77 L68 94 Z" fill="#fbbf24"/>
  </g>

  <g transform="translate(360 240)" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <text x="0" y="60" font-size="84" font-weight="800" letter-spacing="-2">WatchTogether</text>
    <text x="0" y="130" font-size="32" font-weight="400" fill="#cbd5e1">Watch videos and share screens with friends</text>
    <text x="0" y="172" font-size="32" font-weight="400" fill="#cbd5e1">in real-time, peer-to-peer.</text>
  </g>

  <g transform="translate(360 470)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="#f59e0b"/>
    <text x="90" y="29" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Live video</text>

    <rect x="200" y="0" width="200" height="44" rx="22" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="29" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">Screen share</text>

    <rect x="420" y="0" width="140" height="44" rx="22" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="490" y="29" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">Chat</text>
  </g>
</svg>
